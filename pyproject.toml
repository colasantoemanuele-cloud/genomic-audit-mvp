[project]
name = "genomic-audit"
version = "0.9.1"
description = "Audit del leakage per paziente e validazione dell'annotazione via TCR per coorti cliniche piccole"
authors = [
    { name = "Emanuele Colasanto" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "anndata>=0.10",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "streamlit>=1.51",
    "altair>=5",
]

[project.scripts]
audit-sc = "cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.5",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core"]
py-modules = ["cli", "app"]

[tool.uv]
package = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "slow: calibrazioni e test lunghi; girano quando cambia lo stimatore che verificano e nel giro di chiusura",
]

[tool.ruff]
line-length = 140
# revisione/log: copie letterali dei comandi eseguiti (es. la prova C2 della guida), non codice del progetto
extend-exclude = ["revisione/log"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B905"]  # zip senza strict: le lunghezze sono già controllate dove contano
